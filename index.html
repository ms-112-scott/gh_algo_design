<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GH 演算法設計圖鑑｜Grasshopper 生成式演算法收集</title>
<meta name="description" content="為教學用途建立的 Grasshopper 生成式演算法收集網頁：七大家族、基礎範例、變形、建築與 creative coding 應用案例。">
<link rel="icon" href="assets/gia-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   色彩規劃「製圖桌」
   紙（背景）＋墨（文字）＋暗色生成磚（演算法畫面）＋六家族色
   ============================================================ */
:root{
  --paper:#F5F2EC; --surface:#FFFFFF; --ink:#17171C; --ink-2:#45434C; --mute:#67635B; --line:#E6E1D7;
  --tile:#15151B; --tile-2:#1E1E26;
  --A:#E4572E; --A-deep:#B8391A; --A-tint:#FBE6DF;
  --B:#3FA34D; --B-deep:#2A7A36; --B-tint:#E2F2E4;
  --C:#2F6FE4; --C-deep:#1F50B0; --C-tint:#E1EAFB;
  --D:#9152E0; --D-deep:#6D35B3; --D-tint:#EEE3FB;
  --E:#F2A007; --E-deep:#A86A00; --E-tint:#FDF0D5;
  --F:#14A38F; --F-deep:#0B7768; --F-tint:#D9F2EE;
  --fam:var(--A); --fam-deep:var(--A-deep); --fam-tint:var(--A-tint);
  --r:18px; --r-sm:12px;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:160ms; --t-med:280ms; --t-slow:520ms;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.55;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
:focus-visible{outline:3px solid var(--C);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(245,242,236,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 24px;display:flex;gap:16px;align-items:center;border-bottom:1px solid transparent;transition:border-color var(--t-med)}
.top.scrolled{border-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:#fff}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#ECE8E0;border-radius:999px;padding:0 16px;height:46px;max-width:760px;transition:background var(--t-fast),box-shadow var(--t-fast)}
.search:focus-within{background:#fff;box-shadow:0 0 0 3px rgba(47,111,228,.25)}
.search{overflow:hidden}
.search input{border:0;background:none;flex:1;font:inherit;outline:none;height:100%;min-width:0;width:100%;text-overflow:ellipsis}
.sample-flag{font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap}


/* 站內導覽 */
.sitenav{display:flex;align-items:center;gap:4px;flex:none}
.sitenav a{display:inline-flex;align-items:center;height:40px;padding:0 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:700;white-space:nowrap}
.sitenav a:hover{background:#ECE8E0}
.sitenav a[aria-current=page]{background:var(--ink);color:#fff}
.brand img{height:22px;width:auto;display:block}
.brand .sepbar{width:1px;height:22px;background:var(--line)}
@media (max-width:860px){.sitenav a.opt{display:none}}
@media (max-width:600px){.brand img,.brand .sepbar{display:none}.sitenav a{padding:0 10px}}


/* ---------- 首頁補充 ---------- */
.brand .gia{width:38px;height:38px;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt small{font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.04em}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line);flex:none;transition:transform var(--t-fast) var(--ease-spring)}
.iconbtn:hover{transform:scale(1.06)}
.feedbar{display:flex;align-items:center;gap:10px;padding:2px 24px 0;font-size:13px;color:var(--mute)}
#empty{padding:60px 24px;text-align:center;color:var(--mute)}
#sentinel{height:1px}
.cc-tag{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:999px;background:#17171C;color:#fff;font:700 11px "JetBrains Mono",monospace;letter-spacing:.02em}
.cc-tag svg.i{width:14px;height:14px}
.kicker .cc-tag,.lg .cc-tag{position:static}
.media .cc-tag + img + .demo-tag,.media .cc-tag ~ .demo-tag{top:40px}
.ctrl-note{font-size:12px;color:rgba(255,255,255,.7)}
.flow.gen .pict svg.big{width:40px;height:40px;stroke:var(--fam-deep,var(--ink));stroke-width:1.7}
.flow.gen .step b{font-size:13px;line-height:1.35;min-height:2.7em}
.steps-full{margin-top:10px;font-size:14px;color:var(--ink-2)}
.steps-full summary{cursor:pointer;font-weight:700;color:var(--mute);font-size:13px;padding:6px 0;min-height:32px}
.steps-full ol{margin:6px 0 0;padding-left:22px}
.steps-full li{margin:4px 0}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:12px 14px}
.pcard .pi{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--fam-deep,var(--ink));flex:none}
.pcard code{font:700 13px "JetBrains Mono","Noto Sans TC","Microsoft JhengHei",monospace}
.pcard p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.tipbox{display:flex;gap:12px;align-items:flex-start;margin-top:16px;background:#FFF8E6;border-radius:14px;padding:14px 16px}
.tipbox svg.i{color:#A86A00;margin-top:2px}
.tipbox p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.refs{margin:0;padding-left:20px;font-size:14px}
.refs li{margin:6px 0}
.refs span{color:var(--mute);margin-left:8px;font-size:13px}
.subh{font-size:16px;margin:22px 0 10px;display:flex;gap:8px;align-items:center}
.subh small{color:var(--mute);font-weight:400;font-size:12px}
/* 關於（資訊按鈕） */
.info-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:34px 34px 26px;background:var(--paper)}
.info-hero img{width:96px;height:96px}
.info-hero h2{font-size:30px;margin:0 0 6px;font-weight:900;line-height:1.2}
.info-hero p{margin:0;color:var(--ink-2)}
.istats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.istats .stat{background:var(--paper);border-radius:14px;padding:12px 14px}
.istats .stat b{display:block;font:900 24px "JetBrains Mono",monospace}
.istats .stat small{color:var(--mute);font-size:12px}
.isteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.isteps > div{background:var(--paper);border-radius:16px;padding:16px 18px}
.isteps b{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:4px}
.isteps p{margin:0;font-size:14px;color:var(--ink-2)}
.ifams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ifam{background:var(--paper);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ifam .list{display:flex;flex-wrap:wrap;gap:4px}
.linkchip{border:0;background:none;padding:4px 2px;min-height:34px;display:inline-flex;align-items:center;max-width:100%}
.linkchip:hover .tg{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.itable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:var(--paper);border-radius:14px;overflow:hidden}
.itable th,.itable td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.itable tr:last-child td{border-bottom:0}
.itable th{font-size:12px;color:var(--mute)}
.itable td:first-child{font-weight:700;white-space:nowrap}
.course{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px}
.course .card{background:var(--paper);border-radius:16px;padding:18px 20px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.goals{display:flex;flex-direction:column;gap:12px}
.goals div{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.goals .gi{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center}
.goals b{font-size:15px}
.goals p{margin:0;font-size:14px;color:var(--ink-2)}
.notes{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.notes li{margin:6px 0}
.btn-reset{margin-top:12px;border:1.5px solid #D6D0C4;background:#fff;border-radius:999px;height:40px;padding:0 16px;font-weight:700;font-size:13px}
.btn-reset:hover{border-color:var(--ink)}
@media (max-width:860px){
  .istats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .isteps,.ifams,.course{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .info-hero{grid-template-columns:minmax(0,1fr);padding:24px 20px}
  .info-hero img{width:64px;height:64px}
  .istats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .itable td:first-child{white-space:normal}
  .brand .bt small{display:none}
  .feedbar{padding:2px 12px 0}
}

/* ---------- chips row ---------- */
.chiprow{display:flex;flex-direction:column;gap:2px;padding:8px 24px 4px}
.chipline{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.chipline::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:#ECE8E0;border-radius:999px;padding:0 14px;height:40px;white-space:nowrap;font-weight:500;font-size:14px;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease-spring)}
.chip:hover{background:#E2DDD3}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chiprow .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
/* 左右捲動提示：還有內容的那一側出現漸層與箭頭 */
.clwrap{position:relative;min-width:0}
.clwrap::before,.clwrap::after{content:"";position:absolute;top:0;bottom:0;width:56px;pointer-events:none;opacity:0;transition:opacity var(--t-fast);z-index:1}
.clwrap::before{left:0;background:linear-gradient(90deg,var(--paper) 35%,rgba(245,242,236,0))}
.clwrap::after{right:0;background:linear-gradient(270deg,var(--paper) 35%,rgba(245,242,236,0))}
.clwrap.can-l::before,.clwrap.can-r::after{opacity:1}
.clarr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;opacity:0;pointer-events:none;box-shadow:0 2px 8px rgba(23,23,28,.10);transition:opacity var(--t-fast)}
.clarr svg.i{width:16px;height:16px}
.clarr.l{left:0}.clarr.r{right:0}
.clwrap.can-l .clarr.l,.clwrap.can-r .clarr.r{opacity:1;pointer-events:auto}
.clwrap.can-r .clarr.r{animation:nudge 1.4s var(--ease-out) 2}
@keyframes nudge{0%,100%{transform:translate(0,-50%)}50%{transform:translate(5px,-50%)}}
/* 家族＋演算法：家族可展開／合併，展開後演算法接在家族後面 */
.famgroup{display:flex;align-items:center;gap:2px;flex:none;border-radius:14px;padding:0 2px;transition:background var(--t-fast)}
.famgroup.open{background:#ECE8E0;padding-right:8px}
.fexp{display:inline-flex;align-items:center;gap:1px;height:28px;min-width:28px;padding:0 5px;border:0;border-radius:999px;background:none;color:var(--mute);
  font:700 11px "JetBrains Mono",ui-monospace,monospace}
.fexp:hover{background:rgba(23,23,28,.07);color:var(--ink)}
.fexp svg.i{width:14px;height:14px}
.falgos{display:inline-flex;align-items:center;gap:2px;animation:fopen var(--t-med) var(--ease-out)}
@keyframes fopen{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.fcount{font:700 11px "JetBrains Mono",ui-monospace,monospace;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;margin-left:-2px}
/* 虛擬碼 */
.pseudo{margin:0;background:var(--tile);color:#E9E6DF;border-radius:var(--r-sm);padding:18px 20px;overflow-x:auto;
  font:500 14px/1.75 "JetBrains Mono","Noto Sans TC",ui-monospace,monospace;white-space:pre;tab-size:2}
.pseudo .kw{color:#fff;font-weight:700}
.pseudo .op{color:var(--fam)}
.pseudo .pv{color:#9FD2FF}
.pseudo .cm{color:#8C8880}

/* ---------- masonry ---------- */
.feed{padding:12px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));grid-auto-rows:4px;column-gap:16px}
.pin{grid-row-end:span 60;align-self:start;margin-bottom:16px;cursor:pointer;border:0;background:none;padding:0;text-align:left;
  opacity:0;transform:translateY(18px) scale(.97)}
.pin.in{animation:pinIn var(--t-slow) var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes pinIn{to{opacity:1;transform:none}}
.pin .media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--tile);isolation:isolate;
  transition:transform var(--t-med) var(--ease-out),box-shadow var(--t-med)}
.pin:hover .media,.pin:focus-visible .media{transform:translateY(-4px);box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.pin .media img,.pin .media canvas{display:block;width:100%;height:auto;transition:transform var(--t-slow) var(--ease-out)}
.pin:hover .media img{transform:scale(1.04)}
.pin .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0) 45%,rgba(0,0,0,.55));opacity:0;transition:opacity var(--t-med)}
.pin:hover .scrim{opacity:1}
.pin .open{position:absolute;right:10px;bottom:10px;background:#fff;color:var(--ink);border-radius:999px;height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  opacity:0;transform:translateY(6px);transition:opacity var(--t-med),transform var(--t-med) var(--ease-out)}
.pin:hover .open{opacity:1;transform:none}
.badge{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);color:var(--ink);border-radius:999px;height:28px;padding:0 10px 0 8px;font-size:12px;font-weight:700}
.badge svg.i{width:16px;height:16px}
.badge.dark{background:rgba(21,21,27,.8);color:#fff}
.demo-tag{position:absolute;right:10px;top:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 7px}
.pin .cap{padding:8px 4px 0}
.pin .cap b{display:block;font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .cap .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:3px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:#D8D2C6}
.dots i.on{background:var(--fam)}
.seed .media{background:var(--fam-tint);padding:22px 18px 18px;color:var(--fam-deep)}
.seed .media h4{margin:26px 0 10px;font-size:21px;line-height:1.3;font-weight:900}
.seed .combo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seed .combo{color:var(--fam-deep);max-width:100%}
.seed .combo .tg-algo{white-space:normal;height:auto;min-height:26px;line-height:1.25}
.seed .combo .tg-algo .nm{padding:4px 0}

/* ============================================================
   標籤系統：形狀決定「是哪一類」，顏色只用在身分鏈（家族→演算法→變形）
   身分鏈 ① 家族   方塊　　　實心家族色，方角
          ② 演算法 分段膠囊 實心 ID 塊＋白底名稱
          ③ 變形   虛線膠囊 淡底＋分岔圖示＋母演算法 ID
   描述　 ④ 卡片類型 只出現在圖片左上，黑／白圓章
          ⑤ 應用類型 灰底圓膠囊＋線性圖示
          ⑥ 屬性（邏輯、資料結構、尺度、工具）方角細框
          ⑦ 關鍵字 無框，# 前綴
   ============================================================ */
.tg{display:inline-flex;align-items:center;gap:5px;height:26px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1;vertical-align:middle;flex:0 1 auto;min-width:0;max-width:100%}
.tg .nm{overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.5}
.tg svg.i{width:14px;height:14px}
.tg-fam{background:var(--fc);color:#fff;border-radius:5px;padding:0 9px 0 0;overflow:hidden}
.tg-fam .L{background:rgba(0,0,0,.2);align-self:stretch;width:24px;display:grid;place-items:center;font:900 13px "JetBrains Mono",monospace}
.tg-fam.short{padding:0}
.tg-algo{border-radius:999px;border:1.5px solid var(--fc);background:#fff;color:var(--ink);padding:0 10px 0 0;overflow:hidden}
.tg-algo .id{background:var(--fc);color:#fff;align-self:stretch;padding:0 7px 0 9px;display:grid;place-items:center;font:700 11px "JetBrains Mono",monospace}
.tg-algo.short{padding:0}
.tg-algo.short .id{padding:0 9px}
.tg-var{border-radius:999px;border:1.5px dashed var(--fc);background:var(--ft);color:var(--fd);padding:0 10px 0 7px}
.tg-var .pid{font:700 10px "JetBrains Mono",monospace;opacity:.75}
.tg-var .nm{max-width:9em}
.cap .tg-var .nm{max-width:6em}
.tg-cat{border-radius:999px;background:#E6E1D7;color:var(--ink);padding:0 10px 0 8px}
.tg-attr{border-radius:4px;border:1.5px solid #B9B3A7;color:var(--ink-2);padding:0 8px 0 6px;background:#fff;font-weight:500}
.tg-kw{color:var(--mute);font-weight:500;padding:0 1px;height:22px}
.tg-kw::before{content:"#";opacity:.55;margin-right:1px}
.chain{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;max-width:100%}
.chain .chev{color:#B9B3A7;font-size:14px;font-weight:700}
.taglines{display:flex;flex-direction:column;gap:8px}
.tagline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tagline > .lbl{font-size:11px;color:var(--mute);width:48px;flex:none}
/* ④ 卡片類型章 */
.badge.t-algo{background:var(--ink);color:#fff}
.badge.t-var{background:#fff;color:var(--ink);border:1.5px dashed var(--ink)}
.badge.t-case{background:#fff;color:var(--ink)}
.badge.inline.t-case{box-shadow:inset 0 0 0 1.5px #D6D0C4}
.badge.t-seed{background:var(--ink);color:#fff}
.badge.inline{position:static;display:inline-flex}
/* 篩選列群組 */
.fgroup{display:flex;align-items:center;gap:4px;flex:none}
.fgroup > .glabel{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin:0 4px 0 2px}
.fchip{border:0;background:none;padding:0 2px;height:44px;display:inline-flex;align-items:center;border-radius:10px;transition:transform var(--t-fast) var(--ease-spring)}
.fchip:active{transform:scale(.94)}
/* 篩選鈕：未選＝白底；選取＝整顆黑底白字（家族字母、演算法編號保留家族色） */
.fchip .tg,.fchip .badge{height:32px;font-size:13px;transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast)}
.fchip .badge{position:static;background:#fff;color:var(--ink);border:1.5px solid #D6D0C4;box-shadow:none}
.fchip .badge.t-var{border-style:dashed}
.fchip .tg-attr{border-radius:999px;border-color:#D6D0C4;padding:0 12px 0 10px}
.fchip .tg-cat{background:#fff;border:1.5px solid #D6D0C4}
.fchip .tg-fam{background:#fff;color:var(--fd);border:1.5px solid var(--fc)}
.fchip .tg-fam .L{background:var(--fc);color:#fff}
.fchip:hover .tg,.fchip:hover .badge{border-color:var(--ink)}
.tg-diff{gap:6px}
.tg-diff .dots i.on{background:currentColor}
.fchip[aria-pressed=true] .tg-diff .dots i{background:rgba(255,255,255,.3)}
.fchip[aria-pressed=true] .tg-diff .dots i.on{background:#fff}
.fchip[aria-pressed=true] .tg,.fchip[aria-pressed=true] .badge{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchip[aria-pressed=true] .tg-algo .id,.fchip[aria-pressed=true] .tg-fam .L{background:var(--fc);color:#fff}
.fchip[disabled]{opacity:.35;cursor:not-allowed}
/* 圖例 */
.legend-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;border-radius:999px;height:40px;padding:0 14px;font-weight:700;font-size:13px;box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.legend{position:fixed;top:70px;right:20px;z-index:30;width:440px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:20px;
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity var(--t-med),transform var(--t-med) var(--ease-out)}
.legend.on{opacity:1;transform:none;pointer-events:auto}
.legend h4{margin:0 0 4px;font-size:16px}
.legend .lg-sec{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.1em;margin:14px 0 4px}
.legend .lg{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.legend .lg p{margin:0;color:var(--ink-2)}
.legend .lg p b{display:block;color:var(--ink)}
.cap .chain{margin-top:6px}
.cap .row2{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}

/* ---------- modal / closeup ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(18,18,22,.62);overflow:auto;padding:28px 88px 60px;
  opacity:0;pointer-events:none;transition:opacity var(--t-med)}
.modal.on{opacity:1;pointer-events:auto}
.sheet{max-width:1180px;margin:0 auto;background:var(--surface);border-radius:28px;overflow:hidden;
  transform:translateY(24px) scale(.98);transition:transform var(--t-slow) var(--ease-out)}
.modal.on .sheet{transform:none}
.close{position:fixed;top:28px;right:20px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;z-index:41;
  box-shadow:0 4px 14px rgba(0,0,0,.2);transition:transform var(--t-fast) var(--ease-spring)}
.close:hover{transform:rotate(90deg)}
.closeup{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.closeup .right,.sec{min-width:0}
.closeup h2{overflow-wrap:anywhere}
.vchip > div{min-width:0;flex:1}
.fact{min-width:0}
.fact .tg{white-space:normal;height:auto;min-height:26px;padding-top:4px;padding-bottom:4px;line-height:1.3}
.sheet{overflow:hidden}
.closeup .left{background:var(--tile);position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:center}
.closeup .left canvas,.closeup .left img{width:100%;height:auto;display:block}
.closeup .left .credit{padding:12px 16px 14px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.72);background:var(--tile-2)}
.closeup .left .credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.ctrl{display:flex;flex-direction:column;gap:12px;padding:16px 20px 22px;background:var(--tile-2);color:#fff}
.ctrl .row{display:flex;align-items:center;gap:12px}
.ctrl label{display:flex;align-items:center;gap:8px;font-size:13px;width:118px;color:rgba(255,255,255,.8)}
.ctrl input[type=range]{flex:1;accent-color:var(--fam)}
.ctrl output{width:44px;text-align:right;font-size:13px}
.ctrl .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--fam);color:#fff;height:40px;padding:0 16px;font-weight:700;font-size:14px}
.closeup .right{padding:34px 34px 30px}
.kicker{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700;color:var(--fam-deep)}
.closeup h2{font-size:36px;line-height:1.15;margin:8px 0 6px;font-weight:900}
.closeup .en{color:var(--mute);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
.fact{background:var(--paper);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fact .ico{width:38px;height:38px;border-radius:10px;background:var(--fam-tint);color:var(--fam-deep);display:grid;place-items:center}
.fact small{color:var(--mute);font-size:12px}
.fact b{font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px}
.oneliner{font-size:17px;margin:16px 0 0;color:var(--ink-2)}

.sec{padding:30px 34px;border-top:1px solid var(--line)}
.sec h3{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:20px;font-weight:900}
.sec h3 small{font-weight:400;color:var(--mute);font-size:13px}

/* 怎麼運作：圖示流程 */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:14px 14px 10px;margin:0 -14px}
.step{flex:1 0 128px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;opacity:0;transform:translateY(10px)}
.in .step{animation:pinIn var(--t-slow) var(--ease-out) forwards;animation-delay:calc(var(--i) * 140ms)}
.step .pict{width:112px;height:112px;border-radius:24px;background:var(--paper);display:grid;place-items:center;position:relative;transition:background var(--t-med),transform var(--t-med) var(--ease-spring)}
.step:hover .pict{background:var(--fam-tint);transform:translateY(-3px)}
.step .pict svg{width:84px;height:84px}
.step .n{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.step b{font-size:15px}
.arrow{flex:0 0 34px;display:grid;place-items:center;color:#C9C2B4;opacity:0}
.in .arrow{animation:pinIn var(--t-med) var(--ease-out) forwards;animation-delay:calc(var(--i) * 140ms + 70ms)}
.p-ink{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.p-fam{stroke:var(--fam);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.p-fill{fill:var(--fam)}
.p-tile{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.p-txt{font:700 18px "JetBrains Mono",monospace;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes walk{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(14px,-14px) rotate(0)}60%{transform:translate(14px,-14px) rotate(-35deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.step:hover .spin{animation:spin 1.6s linear infinite;transform-origin:42px 42px}
.step:hover .bob{animation:bob .9s ease-in-out infinite}
.step:hover .walk{animation:walk 1.6s var(--ease-out) infinite;transform-origin:30px 58px}
.step:hover .drawme{stroke-dasharray:var(--len);animation:draw 1.2s var(--ease-out) infinite}

/* 符號表 */
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.glyph .sr{white-space:nowrap}
.flow.compact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:22px;overflow:visible;padding:12px 0 4px;margin:0}
.flow.compact .arrow{display:none}
.flow.compact .step .pict{width:96px;height:96px;border-radius:20px}
.flow.compact .step .pict svg{width:72px;height:72px}
.mini-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin:26px 0 12px}
.mini-h small{font-weight:400;color:var(--mute);font-size:12px}
.glyph{background:var(--paper);border-radius:var(--r-sm);padding:10px;display:flex;align-items:center;gap:10px}
.glyph .k{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 18px "JetBrains Mono",monospace}
.glyph svg{width:40px;height:40px}

/* 參數小圖列 */
.params{display:flex;flex-direction:column;gap:18px}
.prow{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.prow .pl{display:flex;align-items:center;gap:8px;font-weight:700}
.prow .pl code{font:500 12px "JetBrains Mono",monospace;color:var(--mute);display:block}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.strip figure{margin:0;background:var(--tile);border-radius:12px;overflow:hidden;position:relative}
.strip canvas{width:100%;display:block}
.strip figcaption{position:absolute;left:6px;bottom:5px;font:700 11px "JetBrains Mono",monospace;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px}
.strip .scale-arrow{grid-column:1/-1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--fam-tint),var(--fam))}

/* C# 積木 */
.blocks{display:flex;gap:10px;flex-wrap:wrap}
.block{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;background:#fff}
.block .bi{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center}
.block .bi svg{width:30px;height:30px}
.block code{font:700 13px "JetBrains Mono","Noto Sans TC","Microsoft JhengHei",monospace}
.block small{display:block;color:var(--mute);font-size:12px}

.subfeed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:4px;column-gap:14px}

/* case closeup */
.vchips{display:flex;flex-direction:column;gap:8px}
.vchip{border:0;background:var(--paper);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;transition:background var(--t-fast)}
.vchip:hover{background:var(--fam-tint)}
.vchip .vi{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--fam-deep);flex:none}
.vchip .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-med) var(--ease-out)}
.vchip[aria-expanded=true] .more{grid-template-rows:1fr}
.vchip .more > div{overflow:hidden;font-size:14px;color:var(--ink-2)}
.vchip .more p{margin:6px 0 0}
.srcbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;margin-top:18px}
.legend-note{font-size:12px;color:var(--mute);margin-top:6px}

@media (max-width:860px){
  .closeup{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .closeup .left{min-height:0}
  .prow{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(3,1fr)}
  .closeup .right,.sec{padding:24px 20px}
  .top{padding:10px 14px}.brand span{display:none}
}
@media (max-width:600px){
  .modal{padding:72px 10px 40px}
  .legend-btn{width:44px;height:44px;padding:0;justify-content:center;flex:none}.legend-btn .lbtxt{display:none}
  .search{min-width:0}
  .legend{top:64px;right:12px}
  .modal.on::before{content:"";position:fixed;left:0;right:0;top:0;height:64px;background:rgba(18,18,22,.94);z-index:1}
  .close{top:8px;right:10px;z-index:2}
  .flow.compact{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feed,.subfeed{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px;padding-left:10px;padding-right:10px}
  .pin .cap b{font-size:13px}.sample-flag{display:none}
}
@media (prefers-reduced-motion:reduce){
  .clwrap.can-r .clarr.r,.falgos{animation:none}
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
  .pin,.step,.arrow{opacity:1;transform:none}
}

    <div><h2>GH 演算法設計圖鑑</h2>
      <p>為教學用途建立的演算法收集網頁，用來學習建築參數化建模與 Grasshopper 生成式演算法。每個演算法都有一支 Grasshopper C# 基礎範例，外加變形、建築與 creative coding 應用案例、延伸專案題目。</p></div>

      <div><b><svg class="i"><use href="#i-eye"/></svg>1　逛圖</b><p>瀑布流裡混著演算法、變形、案例與專案。看到喜歡的形，就是起點。</p></div>

      <div><b><svg class="i"><use href="#i-var"/></svg>3　改成自己的</b><p>從變形挑一個改法，或參考案例與專案發想，組合出自己的演算法應用。</p></div>
    </div></section>
  <section class="sec"><h3><svg class="i"><use href="#i-grid"/></svg>七大家族 <small>家族看「長出來像什麼」；編號＝家族字母＋兩位數</small></h3><div class="ifams" id="iFams"></div></section>
  <section class="sec"><h3><svg class="i"><use href="#i-logic-iterate"/></svg>五種演算法邏輯 <small>看到一個演算法，先問：在變的是什麼、靠哪種邏輯算出來</small></h3>
    <table class="itable"><thead><tr><th>邏輯</th><th>怎麼算</th><th>什麼時候停</th></tr></thead><tbody>
      <tr><td>直接公式</td><td>給座標或編號，直接算出結果</td><td>沒有迭代</td></tr>
      <tr><td>改寫／遞迴</td><td>規則把東西展開成更細的東西</td><td>展開到第幾代，或太小就停</td></tr>
      <tr><td>迭代模擬</td><td>每一步依上一步的狀態更新</td><td>收斂到平衡，或開放地一直長</td></tr>
      <tr><td>搜尋／求解</td><td>在很多可能的解裡，找合法或最好的那個</td><td>找到解，或達到評分門檻</td></tr>
      <tr><td>幾何轉換</td><td>對輸入掃一遍，轉成另一種幾何</td><td>掃完就停</td></tr>
    </tbody></table></section>
