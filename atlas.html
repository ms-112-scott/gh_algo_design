<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖鑑｜GH 演算法設計圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   色彩規劃「製圖桌」
   紙（背景）＋墨（文字）＋暗色生成磚（演算法畫面）＋六家族色
   ============================================================ */
:root{
  --paper:#F5F2EC; --surface:#FFFFFF; --ink:#17171C; --ink-2:#45434C; --mute:#67635B; --line:#E6E1D7;
  --tile:#15151B; --tile-2:#1E1E26;
  --A:#E4572E; --A-deep:#B8391A; --A-tint:#FBE6DF;
  --B:#3FA34D; --B-deep:#2A7A36; --B-tint:#E2F2E4;
  --C:#2F6FE4; --C-deep:#1F50B0; --C-tint:#E1EAFB;
  --D:#9152E0; --D-deep:#6D35B3; --D-tint:#EEE3FB;
  --E:#F2A007; --E-deep:#A86A00; --E-tint:#FDF0D5;
  --F:#14A38F; --F-deep:#0B7768; --F-tint:#D9F2EE;
  --fam:var(--A); --fam-deep:var(--A-deep); --fam-tint:var(--A-tint);
  --r:18px; --r-sm:12px;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:160ms; --t-med:280ms; --t-slow:520ms;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.55;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
:focus-visible{outline:3px solid var(--C);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(245,242,236,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 24px;display:flex;gap:16px;align-items:center;border-bottom:1px solid transparent;transition:border-color var(--t-med)}
.top.scrolled{border-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
.brand .logo{width:36px;height:36px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:#fff}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#ECE8E0;border-radius:999px;padding:0 16px;height:46px;max-width:760px;transition:background var(--t-fast),box-shadow var(--t-fast)}
.search:focus-within{background:#fff;box-shadow:0 0 0 3px rgba(47,111,228,.25)}
.search input{border:0;background:none;flex:1;font:inherit;outline:none;height:100%}
.sample-flag{font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap}


/* 站內導覽 */
.sitenav{display:flex;align-items:center;gap:4px;flex:none}
.sitenav a{display:inline-flex;align-items:center;height:40px;padding:0 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:700;white-space:nowrap}
.sitenav a:hover{background:#ECE8E0}
.sitenav a[aria-current=page]{background:var(--ink);color:#fff}
.brand img{height:22px;width:auto;display:block}
.brand .sepbar{width:1px;height:22px;background:var(--line)}
@media (max-width:860px){.sitenav a.opt{display:none}}
@media (max-width:600px){.brand img,.brand .sepbar{display:none}.sitenav a{padding:0 10px}}

/* ---------- chips row ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:10px 24px 6px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:#ECE8E0;border-radius:999px;padding:0 14px;height:40px;white-space:nowrap;font-weight:500;font-size:14px;
  transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease-spring)}
.chip:hover{background:#E2DDD3}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chiprow .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}

/* ---------- masonry ---------- */
.feed{padding:12px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));grid-auto-rows:4px;column-gap:16px}
.pin{grid-row-end:span 60;align-self:start;margin-bottom:16px;cursor:pointer;border:0;background:none;padding:0;text-align:left;
  opacity:0;transform:translateY(18px) scale(.97)}
.pin.in{animation:pinIn var(--t-slow) var(--ease-out) forwards;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes pinIn{to{opacity:1;transform:none}}
.pin .media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--tile);isolation:isolate;
  transition:transform var(--t-med) var(--ease-out),box-shadow var(--t-med)}
.pin:hover .media,.pin:focus-visible .media{transform:translateY(-4px);box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.pin .media img,.pin .media canvas{display:block;width:100%;height:auto;transition:transform var(--t-slow) var(--ease-out)}
.pin:hover .media img{transform:scale(1.04)}
.pin .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0) 45%,rgba(0,0,0,.55));opacity:0;transition:opacity var(--t-med)}
.pin:hover .scrim{opacity:1}
.pin .open{position:absolute;right:10px;bottom:10px;background:#fff;color:var(--ink);border-radius:999px;height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  opacity:0;transform:translateY(6px);transition:opacity var(--t-med),transform var(--t-med) var(--ease-out)}
.pin:hover .open{opacity:1;transform:none}
.badge{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);color:var(--ink);border-radius:999px;height:28px;padding:0 10px 0 8px;font-size:12px;font-weight:700}
.badge svg.i{width:16px;height:16px}
.badge.dark{background:rgba(21,21,27,.8);color:#fff}
.demo-tag{position:absolute;right:10px;top:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 7px}
.pin .cap{padding:8px 4px 0}
.pin .cap b{display:block;font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .cap .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:3px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:#D8D2C6}
.dots i.on{background:var(--fam)}
.seed .media{background:var(--fam-tint);padding:22px 18px 18px;color:var(--fam-deep)}
.seed .media h4{margin:26px 0 10px;font-size:21px;line-height:1.3;font-weight:900}
.seed .combo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seed .combo{color:var(--fam-deep);max-width:100%}
.seed .combo .tg-algo{white-space:normal;height:auto;min-height:26px;line-height:1.25}
.seed .combo .tg-algo .nm{padding:4px 0}

/* ============================================================
   標籤系統：形狀決定「是哪一類」，顏色只用在身分鏈（家族→演算法→變形）
   身分鏈 ① 家族   方塊　　　實心家族色，方角
          ② 演算法 分段膠囊 實心 ID 塊＋白底名稱
          ③ 變形   虛線膠囊 淡底＋分岔圖示＋母演算法 ID
   描述　 ④ 卡片類型 只出現在圖片左上，黑／白圓章
          ⑤ 應用類型 灰底圓膠囊＋線性圖示
          ⑥ 屬性（邏輯、資料結構、尺度、工具）方角細框
          ⑦ 關鍵字 無框，# 前綴
   ============================================================ */
.tg{display:inline-flex;align-items:center;gap:5px;height:26px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1;vertical-align:middle;flex:0 1 auto;min-width:0;max-width:100%}
.tg .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tg svg.i{width:14px;height:14px}
.tg-fam{background:var(--fc);color:#fff;border-radius:5px;padding:0 9px 0 0;overflow:hidden}
.tg-fam .L{background:rgba(0,0,0,.2);align-self:stretch;width:24px;display:grid;place-items:center;font:900 13px "JetBrains Mono",monospace}
.tg-fam.short{padding:0}
.tg-algo{border-radius:999px;border:1.5px solid var(--fc);background:#fff;color:var(--ink);padding:0 10px 0 0;overflow:hidden}
.tg-algo .id{background:var(--fc);color:#fff;align-self:stretch;padding:0 7px 0 9px;display:grid;place-items:center;font:700 11px "JetBrains Mono",monospace}
.tg-algo.short{padding:0}
.tg-algo.short .id{padding:0 9px}
.tg-var{border-radius:999px;border:1.5px dashed var(--fc);background:var(--ft);color:var(--fd);padding:0 10px 0 7px}
.tg-var .pid{font:700 10px "JetBrains Mono",monospace;opacity:.75}
.tg-var .nm{max-width:9em}
.cap .tg-var .nm{max-width:6em}
.tg-cat{border-radius:999px;background:#E6E1D7;color:var(--ink);padding:0 10px 0 8px}
.tg-attr{border-radius:4px;border:1.5px solid #B9B3A7;color:var(--ink-2);padding:0 8px 0 6px;background:#fff;font-weight:500}
.tg-kw{color:var(--mute);font-weight:500;padding:0 1px;height:22px}
.tg-kw::before{content:"#";opacity:.55;margin-right:1px}
.chain{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;max-width:100%}
.chain .chev{color:#B9B3A7;font-size:14px;font-weight:700}
.taglines{display:flex;flex-direction:column;gap:8px}
.tagline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tagline > .lbl{font-size:11px;color:var(--mute);width:48px;flex:none}
/* ④ 卡片類型章 */
.badge.t-algo{background:var(--ink);color:#fff}
.badge.t-var{background:#fff;color:var(--ink);border:1.5px dashed var(--ink)}
.badge.t-case{background:#fff;color:var(--ink)}
.badge.inline.t-case{box-shadow:inset 0 0 0 1.5px #D6D0C4}
.badge.t-seed{background:var(--ink);color:#fff}
.badge.inline{position:static;display:inline-flex}
/* 篩選列群組 */
.fgroup{display:flex;align-items:center;gap:4px;flex:none}
.fgroup > .glabel{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin:0 4px 0 2px}
.fchip{border:0;background:none;padding:0 2px;height:44px;display:inline-flex;align-items:center;border-radius:10px;transition:transform var(--t-fast) var(--ease-spring)}
.fchip:active{transform:scale(.94)}
.fchip .tg,.fchip .badge{height:30px;font-size:13px;transition:box-shadow var(--t-fast)}
.fchip .badge{position:static}
.fchip[aria-pressed=true] .tg,.fchip[aria-pressed=true] .badge{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.fchip[disabled]{opacity:.35;cursor:not-allowed}
/* 圖例 */
.legend-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;border-radius:999px;height:40px;padding:0 14px;font-weight:700;font-size:13px;box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.legend{position:fixed;top:70px;right:20px;z-index:30;width:440px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:20px;
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity var(--t-med),transform var(--t-med) var(--ease-out)}
.legend.on{opacity:1;transform:none;pointer-events:auto}
.legend h4{margin:0 0 4px;font-size:16px}
.legend .lg-sec{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.1em;margin:14px 0 4px}
.legend .lg{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.legend .lg p{margin:0;color:var(--ink-2)}
.legend .lg p b{display:block;color:var(--ink)}
.cap .chain{margin-top:6px}
.cap .row2{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}

/* ---------- modal / closeup ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(18,18,22,.62);overflow:auto;padding:28px 88px 60px;
  opacity:0;pointer-events:none;transition:opacity var(--t-med)}
.modal.on{opacity:1;pointer-events:auto}
.sheet{max-width:1180px;margin:0 auto;background:var(--surface);border-radius:28px;overflow:hidden;
  transform:translateY(24px) scale(.98);transition:transform var(--t-slow) var(--ease-out)}
.modal.on .sheet{transform:none}
.close{position:fixed;top:28px;right:20px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;z-index:41;
  box-shadow:0 4px 14px rgba(0,0,0,.2);transition:transform var(--t-fast) var(--ease-spring)}
.close:hover{transform:rotate(90deg)}
.closeup{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.closeup .right,.sec{min-width:0}
.closeup h2{overflow-wrap:anywhere}
.vchip > div{min-width:0;flex:1}
.fact{min-width:0}
.fact .tg{white-space:normal;height:auto;min-height:26px;padding-top:4px;padding-bottom:4px;line-height:1.3}
.sheet{overflow:hidden}
.closeup .left{background:var(--tile);position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:center}
.closeup .left canvas,.closeup .left img{width:100%;height:auto;display:block}
.closeup .left .credit{padding:12px 16px 14px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.72);background:var(--tile-2)}
.closeup .left .credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.ctrl{display:flex;flex-direction:column;gap:12px;padding:16px 20px 22px;background:var(--tile-2);color:#fff}
.ctrl .row{display:flex;align-items:center;gap:12px}
.ctrl label{display:flex;align-items:center;gap:8px;font-size:13px;width:118px;color:rgba(255,255,255,.8)}
.ctrl input[type=range]{flex:1;accent-color:var(--fam)}
.ctrl output{width:44px;text-align:right;font-size:13px}
.ctrl .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--fam);color:#fff;height:40px;padding:0 16px;font-weight:700;font-size:14px}
.closeup .right{padding:34px 34px 30px}
.kicker{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700;color:var(--fam-deep)}
.closeup h2{font-size:36px;line-height:1.15;margin:8px 0 6px;font-weight:900}
.closeup .en{color:var(--mute);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
.fact{background:var(--paper);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fact .ico{width:38px;height:38px;border-radius:10px;background:var(--fam-tint);color:var(--fam-deep);display:grid;place-items:center}
.fact small{color:var(--mute);font-size:12px}
.fact b{font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px}
.oneliner{font-size:17px;margin:16px 0 0;color:var(--ink-2)}

.sec{padding:30px 34px;border-top:1px solid var(--line)}
.sec h3{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:20px;font-weight:900}
.sec h3 small{font-weight:400;color:var(--mute);font-size:13px}

/* 怎麼運作：圖示流程 */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:14px 14px 10px;margin:0 -14px}
.step{flex:1 0 128px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;opacity:0;transform:translateY(10px)}
.in .step{animation:pinIn var(--t-slow) var(--ease-out) forwards;animation-delay:calc(var(--i) * 140ms)}
.step .pict{width:112px;height:112px;border-radius:24px;background:var(--paper);display:grid;place-items:center;position:relative;transition:background var(--t-med),transform var(--t-med) var(--ease-spring)}
.step:hover .pict{background:var(--fam-tint);transform:translateY(-3px)}
.step .pict svg{width:84px;height:84px}
.step .n{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.step b{font-size:15px}
.arrow{flex:0 0 34px;display:grid;place-items:center;color:#C9C2B4;opacity:0}
.in .arrow{animation:pinIn var(--t-med) var(--ease-out) forwards;animation-delay:calc(var(--i) * 140ms + 70ms)}
.p-ink{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.p-fam{stroke:var(--fam);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.p-fill{fill:var(--fam)}
.p-tile{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.p-txt{font:700 18px "JetBrains Mono",monospace;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes walk{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(14px,-14px) rotate(0)}60%{transform:translate(14px,-14px) rotate(-35deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.step:hover .spin{animation:spin 1.6s linear infinite;transform-origin:42px 42px}
.step:hover .bob{animation:bob .9s ease-in-out infinite}
.step:hover .walk{animation:walk 1.6s var(--ease-out) infinite;transform-origin:30px 58px}
.step:hover .drawme{stroke-dasharray:var(--len);animation:draw 1.2s var(--ease-out) infinite}

/* 符號表 */
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.glyph .sr{white-space:nowrap}
.flow.compact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:22px;overflow:visible;padding:12px 0 4px;margin:0}
.flow.compact .arrow{display:none}
.flow.compact .step .pict{width:96px;height:96px;border-radius:20px}
.flow.compact .step .pict svg{width:72px;height:72px}
.mini-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin:26px 0 12px}
.mini-h small{font-weight:400;color:var(--mute);font-size:12px}
.glyph{background:var(--paper);border-radius:var(--r-sm);padding:10px;display:flex;align-items:center;gap:10px}
.glyph .k{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 18px "JetBrains Mono",monospace}
.glyph svg{width:40px;height:40px}

/* 參數小圖列 */
.params{display:flex;flex-direction:column;gap:18px}
.prow{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.prow .pl{display:flex;align-items:center;gap:8px;font-weight:700}
.prow .pl code{font:500 12px "JetBrains Mono",monospace;color:var(--mute);display:block}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.strip figure{margin:0;background:var(--tile);border-radius:12px;overflow:hidden;position:relative}
.strip canvas{width:100%;display:block}
.strip figcaption{position:absolute;left:6px;bottom:5px;font:700 11px "JetBrains Mono",monospace;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px}
.strip .scale-arrow{grid-column:1/-1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--fam-tint),var(--fam))}

/* C# 積木 */
.blocks{display:flex;gap:10px;flex-wrap:wrap}
.block{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;background:#fff}
.block .bi{width:40px;height:40px;border-radius:10px;background:var(--paper);display:grid;place-items:center}
.block .bi svg{width:30px;height:30px}
.block code{font:700 13px "JetBrains Mono",monospace}
.block small{display:block;color:var(--mute);font-size:12px}

.subfeed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:4px;column-gap:14px}

/* case closeup */
.vchips{display:flex;flex-direction:column;gap:8px}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const dots = n => `<span class="dots" aria-label="難度 ${n}／5">${[1,2,3,4,5].map(k => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</span>`;
const LOGIC_ICON = {"直接公式":"i-logic-formula","改寫／遞迴":"i-logic-rewrite","迭代模擬":"i-logic-iterate","搜尋／求解":"i-logic-search","幾何轉換":"i-logic-transform"};
const SCALE_ICON = {"物件":"c-modeling","構件":"c-fabrication","立面／表皮":"c-2d-pattern","建築":"c-3d-architecture","群體／都市":"c-urban-landscape","地景":"c-urban-landscape"};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================================================================
   1. L-System 引擎（網頁版，跟 A01_LSystem.cs 同一套符號）
   ================================================================ */
function rng(seed){ let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function expand(axiom, rules, gens, seed){
  const r = rng(seed); let s = axiom;
  for(let g = 0; g < gens; g++){
    let out = "";
    for(const ch of s){
      const rule = rules[ch];
      if(!rule) out += ch;
      else if(Array.isArray(rule)){ let x = r(), acc = 0, pick = rule[rule.length-1][0]; for(const [str,p] of rule){ acc += p; if(x < acc){ pick = str; break; } } out += pick; }
      else out += rule;
      if(out.length > 90000) return out;
    }
    s = out;
  }
  return s;
}
function noise2(x, y){ return Math.sin(x*1.7 + Math.sin(y*1.3)) * Math.cos(y*1.1 - Math.sin(x*0.9)); }
// 畫筆走一遍：回傳線段（含深度、離根距離），供繪圖與生長動畫用
function turtle(str, o){
  const segs = [], tips = [], st = [];
  let x = 0, y = 0, h = o.heading ?? -Math.PI/2, len = o.step ?? 10, d = 0, dist = 0, prevF = false;
  const ang = (o.angle ?? 25) * Math.PI/180, r = rng((o.seed ?? 1) + 99);
  let pruned = 0;
  for(const ch of str){
    if(pruned){ if(ch === "[") pruned++; else if(ch === "]") pruned--; if(pruned) continue; else { ({x,y,h,len,d,dist} = st.pop()); continue; } }
    if(ch === "F" || ch === "G" || ch === "A" || ch === "B" && o.drawAB){
      if((ch === "A" || ch === "B") && !o.drawAB) continue;
      let L = len;
      if(o.attractor){ const [ax,ay,s] = o.attractor; const dd = Math.hypot(x-ax, y-ay); L *= 0.45 + 1.2*Math.exp(-(dd*dd)/(s*s)); }
      if(o.jitter) h += (r()-0.5) * o.jitter;
      if(o.field) h += noise2(x*o.field, y*o.field) * 0.35;
      const nx = x + Math.cos(h)*L, ny = y + Math.sin(h)*L;
      if(o.bound && !o.bound(nx, ny)){ if(st.length){ pruned = 1; continue; } else continue; }
      segs.push([x,y,nx,ny,d,dist]); dist += L; x = nx; y = ny; prevF = true;
      if(o.tropism){ const [tx,ty,e] = o.tropism; const target = Math.atan2(ty,tx); h += e * Math.sin(target - h); }
    } else if(ch === "f"){ x += Math.cos(h)*len; y += Math.sin(h)*len; }
    else if(ch === "+"){ h -= ang * (o.angleVar ? 1 + (r()-0.5)*o.angleVar : 1); }
    else if(ch === "-"){ h += ang * (o.angleVar ? 1 + (r()-0.5)*o.angleVar : 1); }
    else if(ch === "["){ st.push({x,y,h,len,d,dist}); len *= (o.scale ?? 1); d++; prevF = false; }
    else if(ch === "]"){ if(prevF) tips.push([x,y,d]); ({x,y,h,len,d,dist} = st.pop()); prevF = false; }
  }
  if(prevF) tips.push([x,y,d]);
  return {segs, tips};
}

/* ---------- 預設樣式：演算法本體、12 種變形、案例示意 ---------- */
const TREE = {axiom:"F", rules:{F:"F[+F]F[-F]F"}, gens:4, angle:25.7, scale:1};
const P = {
  hero:   {...TREE, gens:5, angle:22.5, rules:{X:"F+[[X]-X]-F[-FX]+X", F:"FF"}, axiom:"X", ratio:1.35},
  v0:     {forest:5, axiom:"X", rules:{X:[["F[+X][-X]FX",0.34],["F[+X]FX",0.33],["F[-X]FX",0.33]], F:"FF"}, gens:6, angle:24, angleVar:0.5, ratio:0.8},
  v1:     {axiom:"F", rules:{F:"F[+F][-F]"}, gens:7, angle:28, scale:0.72, ratio:1.0, width:true},
  v2:     {axiom:"F", rules:{F:"FF[+F][-F]"}, gens:5, angle:24, scale:0.8, ratio:1.25, pipe:true},
  v3:     {axiom:"X", rules:{X:"F[+X][-X]FX", F:"FF"}, gens:6, angle:26, tropism:[0,1,0.16], ratio:1.1},
  v4:     {axiom:"X", rules:{X:"F[+X][-X]FX", F:"FF"}, gens:6, angle:30, attractorRel:[0.35,0.2,0.35], ratio:1.0, showAttr:true},
  v5:     {axiom:"X", rules:{X:"F[+X][--X]F[-X]+X", F:"FF"}, gens:6, angle:24, boundRel:"circle", ratio:1.0, showBound:true},
  v6:     {axiom:"X", rules:{X:"F[+X]F[-X]+X", F:"FF"}, gens:6, angle:22, surface:true, ratio:0.75},
  v7:     {...TREE, gens:4, ratio:1.3, growth:true},
  v8:     {axiom:"X", rules:{X:"F[+X][-X]FX", F:"FF"}, gens:6, angle:24, field:0.02, ratio:1.2},
  v9:     {axiom:"X", rules:{X:"F[+X][-X]FX", F:"FF"}, gens:5, angle:30, leaves:true, ratio:1.0},
  v10:    {axiom:"F", rules:{F:"F[++F][--F]"}, gens:4, angle:18, scale:0.75, column:true, ratio:1.25},
  v11:    {axiom:"A", rules:{A:"+BF-AFA-FB+", B:"-AF+BFB+FA-"}, gens:5, angle:90, heading:0, ratio:1.0, drawAB:false},
  roads:  {axiom:"F", rules:{F:[["F[+F]F",0.35],["F[-F]F",0.35],["FF",0.3]]}, gens:6, angle:90, scale:0.8, heading:0, ratio:0.85, jitter:0.02},
  pattern:{axiom:"F+F+F+F", rules:{F:"F+F-F-FF+F+F-F"}, gens:3, angle:90, heading:0, ratio:1.0},
  bush:   {axiom:"F", rules:{F:"FF-[-F+F+F]+[+F-F-F]"}, gens:4, angle:22.5, ratio:1.15},
};
const VAR_PRESET = ["v0","v1","v2","v3","v4","v5","v6","v7","v8","v9","v10","v11"];
const CASE_PRESET = {"A01-02":"v10","A01-03":"v10","A01-05":"roads","A01-07":"v0","A01-08":"v2","A01-09":"v1","A01-13":"pattern","A01-14":"v6","A01-15":"bush"};

/* 把一個預設畫進 canvas；t = 0..1 控制生長進度 */
function build(p, overrides = {}){
  const o = {...p, ...overrides};
  if(o.forest){
    const all = {segs:[], tips:[]};
    for(let k = 0; k < o.forest; k++){
      const s = expand(o.axiom, o.rules, o.gens - (k % 2), 7 + k*13);
      const t = turtle(s, {...o, seed: k*31 + 3});
      const dx = k * 150;
      t.segs.forEach(g => all.segs.push([g[0]+dx, g[1], g[2]+dx, g[3], g[4], g[5]]));
    }
    return all;
  }
  const s = expand(o.axiom, o.rules, o.gens, o.seed ?? 5);
  // 先跑一次拿邊界，再換成相對座標的吸引子／邊界
  let t = turtle(s, o);
  if(o.attractorRel || o.boundRel){
    const b = bounds(t.segs); const w = b.x1-b.x0, h = b.y1-b.y0;
    const oo = {...o};
    if(o.attractorRel){ const [rx,ry,rs] = o.attractorRel; oo.attractor = [b.x0 + w*rx, b.y0 + h*ry, Math.max(w,h)*rs]; }
    if(o.boundRel){ const cx = (b.x0+b.x1)/2, cy = b.y0 + h*0.42, R = Math.min(w,h)*0.42; oo.bound = (x,y) => Math.hypot(x-cx,y-cy) < R || y > cy + R*0.35; oo._circle = [cx,cy,R]; }
    t = turtle(s, oo); t.o = oo;
  }
  return t;
}
function bounds(segs){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of segs){ x0=Math.min(x0,s[0],s[2]); x1=Math.max(x1,s[0],s[2]); y0=Math.min(y0,s[1],s[3]); y1=Math.max(y1,s[1],s[3]); }
  return {x0,y0,x1,y1};
}
const FAM = {A:"#E4572E",B:"#3FA34D",C:"#2F6FE4",D:"#9152E0",E:"#F2A007",F:"#14A38F"};
function render(cv, p, t = 1, overrides = {}, geom){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth || 300, H = Math.round(W * (p.ratio ?? 1));
  if(cv.width !== W*dpr || cv.height !== H*dpr){ cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H + "px"; }
  const g = geom || build(p, overrides);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const bg = ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#1C1C24"); bg.addColorStop(1,"#121217");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  if(!g.segs.length) return g;
  let b = bounds(g.segs), pad = W*0.09;
  let sx = (W-2*pad)/Math.max(1e-6,b.x1-b.x0), sy = (H-2*pad)/Math.max(1e-6,b.y1-b.y0), s = Math.min(sx,sy);
  const ox = (W - (b.x1-b.x0)*s)/2 - b.x0*s, oy = (H - (b.y1-b.y0)*s)/2 - b.y0*s;
  let X = x => x*s + ox, Y = y => y*s + oy;
  if(p.surface){ // 貼到一個彎曲屋面：把平面座標投影到正弦曲面上
    const X0 = X, Y0 = Y; X = (x,y) => X0(x) ; Y = (y,x) => Y0(y)*0.72 + H*0.14 + Math.sin((X0(x)/W)*Math.PI*2.2)*H*0.07;
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
    for(let k = 0; k <= 10; k++){ ctx.beginPath(); for(let i = 0; i <= 40; i++){ const xx = i/40*W, yy = (k/10)*H*0.72 + H*0.14 + Math.sin((xx/W)*Math.PI*2.2)*H*0.07; i ? ctx.lineTo(xx,yy) : ctx.moveTo(xx,yy);} ctx.stroke(); }
  }
  const maxDist = Math.max(...g.segs.map(q => q[5])) || 1, maxD = Math.max(...g.segs.map(q => q[4])) || 1;
  const cut = t * (maxDist + 1);
  const col = FAM[p.fam || "A"];
  // 輔助圖形：吸引子、邊界
  if(p.showAttr && g.o?.attractor){ const [ax,ay,rr] = g.o.attractor; const gr = ctx.createRadialGradient(X(ax),Y(ay),0,X(ax),Y(ay),rr*s); gr.addColorStop(0,"rgba(242,160,7,.45)"); gr.addColorStop(1,"rgba(242,160,7,0)"); ctx.fillStyle = gr; ctx.fillRect(0,0,W,H); ctx.fillStyle = "#F2A007"; ctx.beginPath(); ctx.arc(X(ax),Y(ay),5,0,7); ctx.fill(); }
  if(p.showBound && g.o?._circle){ const [cx,cy,R] = g.o._circle; ctx.setLineDash([5,5]); ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X(cx),Y(cy),R*s,0,7); ctx.stroke(); ctx.setLineDash([]); }
  ctx.lineCap = "round";
  for(const q of g.segs){
    if(q[5] > cut) continue;
    const k = q[4]/maxD;
    let w = 1.1;
    if(p.pipe || p.width) w = Math.max(0.8, (p.pipe ? 7 : 4.5) * Math.pow(1 - k, 1.6) * Math.min(1, W/300));
    ctx.strokeStyle = p.pipe ? `rgba(255,255,255,${0.95 - k*0.3})` : mix(col, "#FFFFFF", 0.15 + k*0.55);
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(X(q[0],q[1]), Y(q[1],q[0])); ctx.lineTo(X(q[2],q[3]), Y(q[3],q[2])); ctx.stroke();
  }
  if(p.leaves && t >= 1){ // 枝端長葉：不重疊的圓（E01 Circle Packing 的簡化）
    const placed = [];
    for(const [x,y] of g.tips){ const px = X(x,y), py = Y(y,x); let r = W*0.035; for(const c of placed){ const d = Math.hypot(c[0]-px,c[1]-py) - c[2]; r = Math.min(r, d); } if(r > 2){ placed.push([px,py,r]); ctx.fillStyle = mix("#3FA34D","#FFFFFF",0.2) + "cc"; ctx.beginPath(); ctx.arc(px,py,r*0.92,0,7); ctx.fill(); } }
  }
  if(p.column && t >= 1){ const b2 = bounds(g.segs); ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(pad*0.6, Y(b2.y0)-4); ctx.lineTo(W-pad*0.6, Y(b2.y0)-4); ctx.stroke(); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(W/2-18, Y(b2.y1), 36, 6); }
  return g;
}
function mix(a, b, t){ const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16); const c = k => Math.round(((pa>>k)&255)*(1-t) + ((pb>>k)&255)*t); return "#" + [16,8,0].map(k => c(k).toString(16).padStart(2,"0")).join(""); }
function grow(cv, p, ms = 1100, overrides){
  const g = build(p, overrides); if(reduced){ render(cv,p,1,overrides,g); return; }
  const t0 = performance.now(); cv._anim = t0;
  const tick = now => { if(cv._anim !== t0) return; const t = Math.min(1,(now-t0)/ms); render(cv,p,easeOut(t),overrides,g); if(t < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
const easeOut = t => 1 - Math.pow(1-t, 3);

function allPins(){
  const V = A.variations.map(pinVar), C = CASES.map(pinCase), S = A.project_seeds.map(pinSeed);
  const out = [pinAlgo()]; let i = 0;
  while(V.length || C.length || S.length){
    if(C.length) out.push(C.shift()); if(V.length) out.push(V.shift());
    if(C.length) out.push(C.shift()); if(++i % 3 === 0 && S.length) out.push(S.shift());
  }

}

    ["規則", `${tile(4,30,"F",20)}<path class="p-fam" d="M28 41h10M34 36l5 5-5 5"/>${tile(42,8,"F",14)}${tile(58,8,"[",12,"#FBE6DF")}${tile(42,32,"+F",24)}${tile(42,56,"]F",24,"#FBE6DF")}`],
    ["重複 n 次", `<g class="spin"><path class="p-ink" d="M66 42a24 24 0 1 1-7-17"/><path class="p-ink" d="M66 16v10H56"/></g><text x="42" y="43" class="p-txt" style="font-size:22px;fill:var(--A)">×n</text>`],
    ["畫筆走", `<path class="p-ink" d="M12 70h18" stroke-dasharray="3 5"/><g class="walk"><path d="M30 58l14-8-4 14z" style="fill:var(--A)"/></g><path class="p-fam" d="M56 30a14 14 0 0 1 14 14" /><path class="p-fam" d="M66 42l4 3 2-5"/><text x="62" y="22" class="p-txt" style="font-size:14px">+−</text>`],
    ["記住／回來", `<g class="bob"><rect x="22" y="18" width="40" height="10" rx="4" style="fill:var(--A)"/></g><rect x="22" y="34" width="40" height="10" rx="4" class="p-tile"/><rect x="22" y="50" width="40" height="10" rx="4" class="p-tile"/><path class="p-ink" d="M14 60V20M10 26l4-6 4 6"/><path class="p-ink" d="M70 20v40M66 54l4 6 4-6"/><text x="14" y="72" class="p-txt" style="font-size:13px">[</text><text x="70" y="72" class="p-txt" style="font-size:13px">]</text>`],
    ["輸出線段", `<path class="p-fam drawme" style="--len:160" d="M42 76V48M42 60 28 44M42 60l14-16M42 48V26M42 48 32 34M42 48l10-14M28 44l-8-6M56 44l8-6"/>`],
  ];
  return `<div class="flow${compact ? " compact" : ""}">${steps.map(([t,svg],i) => `
    ${i ? `<div class="arrow" style="--i:${i}">${ico("i-arrow")}</div>` : ""}
    <div class="step" style="--i:${i}"><div class="pict"><span class="n">${i+1}</span><svg viewBox="0 0 84 84" aria-hidden="true">${svg}</svg></div><b>${t}</b></div>`).join("")}</div>`;
}
function glyphs(){
  const G = [
    ["F", `<path class="p-fam" d="M8 30h24M26 24l6 6-6 6"/>`, "前進畫線"],
    ["f", `<path class="p-ink" d="M8 30h24" stroke-dasharray="3 4"/><path class="p-ink" d="M26 24l6 6-6 6"/>`, "前進不畫"],
    ["+", `<path class="p-fam" d="M30 30A12 12 0 1 0 18 18"/><path class="p-fam" d="M13 14l5 4-1 6"/>`, "左轉"],
    ["−", `<path class="p-fam" d="M10 30A12 12 0 1 1 22 18"/><path class="p-fam" d="M27 14l-5 4 1 6"/>`, "右轉"],
    ["[", `<rect x="8" y="10" width="24" height="7" rx="3" style="fill:var(--A)"/><rect x="8" y="21" width="24" height="7" rx="3" class="p-tile"/><path class="p-ink" d="M20 36V30"/>`, "記住位置"],
    ["]", `<rect x="8" y="21" width="24" height="7" rx="3" class="p-tile"/><path class="p-ink" d="M20 6v8M16 10l4 4 4-4"/>`, "回到位置"],
  ];
  return G.map(([k,svg,t]) => `<div class="glyph" title="${t}"><span class="k">${k}</span><svg viewBox="0 0 40 40" aria-hidden="true">${svg}</svg><span class="sr" style="font-size:13px;color:var(--mute)">${t}</span></div>`).join("");
}
function blocks(){
  const B = [
    ["StringBuilder", "拼字串", `<rect x="3" y="10" width="7" height="10" rx="2" class="p-tile"/><rect x="11.5" y="10" width="7" height="10" rx="2" class="p-tile"/><rect x="20" y="10" width="7" height="10" rx="2" style="fill:var(--A)"/>`],
    ["Dictionary<char,string>", "規則表", `<rect x="3" y="6" width="8" height="8" rx="2" class="p-tile"/><path class="p-fam" d="M13 10h5"/><rect x="20" y="6" width="8" height="8" rx="2" style="fill:var(--A)"/><rect x="3" y="17" width="8" height="8" rx="2" class="p-tile"/><path class="p-fam" d="M13 21h5"/><rect x="20" y="17" width="8" height="8" rx="2" style="fill:var(--A)"/>`],
    ["Stack<Pen>", "分岔記憶", `<rect x="6" y="5" width="18" height="6" rx="2" style="fill:var(--A)"/><rect x="6" y="13" width="18" height="6" rx="2" class="p-tile"/><rect x="6" y="21" width="18" height="6" rx="2" class="p-tile"/>`],
    ["Plane", "畫筆方向", `<path class="p-ink" d="M8 24h16" style="stroke:#E4572E"/><path class="p-ink" d="M8 24V8" style="stroke:#3FA34D"/><circle cx="8" cy="24" r="2.5" style="fill:#17171C"/>`],
  ];
  return B.map(([c,s,svg]) => `<div class="block"><div class="bi"><svg viewBox="0 0 30 30" aria-hidden="true">${svg}</svg></div><div><code>${esc(c)}</code><small>${s}</small></div></div>`).join("");
}
function paramStrips(){
  const rows = [
    ["世代","generations", [1,2,3,4,5], v => ({gens:v}), v => "n="+v],
    ["轉角","turnAngle", [10,20,30,45,90], v => ({angle:v}), v => v+"°"],
    ["縮放","branchScale", [1,0.9,0.8,0.7,0.6], v => ({scale:v}), v => v.toFixed(1)],
  ];
  const base = {axiom:"X", rules:{X:"F[+X][-X]FX", F:"FF"}, gens:5, angle:25.7, scale:1, ratio:1.1, fam:"A"};
  const el = document.getElementById("params");
  el.innerHTML = rows.map(([n,code,vals],r) => `<div class="prow"><div class="pl">${ico(["i-logic-iterate","w-state","w-geom"][r])}<div>${n}<code>${code}</code></div></div>
    <div class="strip">${vals.map((v,i) => `<figure><canvas data-r="${r}" data-i="${i}"></canvas><figcaption>${rows[r][4](v)}</figcaption></figure>`).join("")}<div class="scale-arrow"></div></div></div>`).join("");
  el.querySelectorAll("canvas").forEach(cv => { const [n,code,vals,f] = rows[cv.dataset.r]; const bp = cv.dataset.r === "2" ? {...base, axiom:"F", rules:{F:"F[+F][-F]"}, gens:6, angle:30} : base; render(cv, bp, 1, f(vals[cv.dataset.i])); });
}
function wireDetail(key){
  // 區塊進場
  const so = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); so.unobserve(e.target); } }), {root:modal, threshold:.15});
  sheet.querySelectorAll(".sec").forEach(s => so.observe(s));
  if(key === "algo"){
    const cv = document.getElementById("big"), p = {...P.hero, fam:"A"};
    const g = document.getElementById("g"), an = document.getElementById("an"), sc = document.getElementById("sc");
    const ov = () => ({gens:+g.value, angle:+an.value, scale:sc.value/100});
    const upd = (anim) => { document.getElementById("go").textContent = g.value; document.getElementById("ao").textContent = an.value+"°"; document.getElementById("so").textContent = (sc.value/100).toFixed(2); anim ? grow(cv,p,1600,ov()) : render(cv,p,1,ov()); };
    [g,an,sc].forEach(x => x.oninput = () => upd(false));
    document.getElementById("replay").onclick = () => upd(true);
    requestAnimationFrame(() => upd(true));
    paramStrips();
    mountPins(document.getElementById("subVar"), A.variations.map(pinVar));
    mountPins(document.getElementById("subCase"), CASES.map(pinCase));
    mountPins(document.getElementById("subSeed"), A.project_seeds.map(pinSeed));
  } else {
    const cv = document.getElementById("big");
    if(cv){ const p = {...P[cv.dataset.preset], fam:"A"}; requestAnimationFrame(() => grow(cv, p, 1400)); document.getElementById("replay")?.addEventListener("click", () => grow(cv,p,1400)); }
    sheet.querySelectorAll(".vchip").forEach(b => b.onclick = () => b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") !== "true"));
    const more = document.getElementById("subMore");
    if(more) mountPins(more, [pinAlgo(), ...A.variations.slice(0,4).map(pinVar), ...CASES.slice(0,4).map(pinCase)].filter(p => p.key !== key));
  }
}

/* ---- 變形詳細頁 ---- */
function varDetail(i){
  const v = A.variations[i];
  return `<div class="closeup">
    <div class="left"><canvas id="big" data-preset="${VAR_PRESET[i]}"></canvas><div class="ctrl"><div class="row"><button class="btn" id="replay">${ico("i-play")}重播</button></div></div></div>
    <div class="right">
      <div class="kicker">${badge("var", true)} ${chain(tFam("A",true), tAlgo("A01"), tVar(i,"A01"))}</div>
      <h2>${esc(v.title)}</h2>
      <div class="facts">
        <div class="fact"><div class="ico">${ico(whatIcon(v.what_changes))}</div><small>改哪裡</small>${tAttr(whatIcon(v.what_changes), shortWhat(v.what_changes), "改哪裡")}</div>
        <div class="fact"><div class="ico" style="font:900 15px 'JetBrains Mono'">${v.level}/5</div><small>難度</small><b>${dots(v.level)}</b></div>
        <div class="fact"><div class="ico">${ico("i-case")}</div><small>得到</small><b style="font-size:13px;font-weight:500">${esc(v.result)}</b></div>
      </div>
      <div class="vchips"><button class="vchip" aria-expanded="true"><span class="vi">${ico("w-rule")}</span><div><b>怎麼改</b><div class="more"><div><p>${esc(v.how)}</p></div></div></div></button></div>
    </div></div>
  <section class="sec"><h3>${ico("i-var")}更多</h3><div class="subfeed" id="subMore"></div></section>`;
}
/* ---- 案例詳細頁 ---- */
function caseDetail(c){
  const img = !!c.image;
  return `<div class="closeup">
    <div class="left">${img ? `${imgTag(c)}<div class="credit">${c.image.page ? `<a href="${esc(c.image.page)}" target="_blank" rel="noopener">${credit(c.image)}</a>` : credit(c.image)}</div>`
      : `<canvas id="big" data-preset="${CASE_PRESET[c.id] || "bush"}"></canvas><div class="ctrl"><div class="row"><button class="btn" id="replay">${ico("i-play")}重播</button><span style="font-size:13px;opacity:.75">示意圖：以 A01 程式重現概念，非原作</span></div></div>`}</div>
    <div class="right">
      <div class="kicker">${badge("case", true)} ${chain(tFam("A",true), tAlgo("A01"))} ${tCat(c.category)}</div>
      <h2 style="font-size:28px">${esc(c.title)}</h2><div class="en">${esc(c.creator)}${c.year ? "・"+esc(c.year) : ""}</div>
      <div class="facts">
        <div class="fact"><div class="ico">${ico(SCALE_ICON[c.scale] || "c-3d-architecture")}</div><small>尺度</small>${c.scale ? tAttr(SCALE_ICON[c.scale] || "c-3d-architecture", c.scale, "尺度") : "—"}</div>
        <div class="fact"><div class="ico" style="font:900 15px 'JetBrains Mono'">${c.difficulty}/5</div><small>難度</small><b>${dots(c.difficulty)}</b></div>
        <div class="fact"><div class="ico">${ico("i-algo")}</div><small>演算法</small>${tAlgo("A01")}</div>
      </div>
      <p class="oneliner" style="font-size:15px">${esc(c.summary)}</p>
      <h3 style="font-size:16px;margin:22px 0 10px;display:flex;gap:8px;align-items:center">${ico("i-var")}這個案例怎麼改 A01 <small style="color:var(--mute);font-weight:400">點開看改法</small></h3>
      <div class="vchips">${(c.variations||[]).map(v => `<button class="vchip" aria-expanded="false"><span class="vi">${ico(whatIcon(v.how))}</span><div><b>${esc(v.name)}</b><div style="font-size:13px;color:var(--mute)">${esc(v.effect)}</div><div class="more"><div><p>${esc(v.how)}</p></div></div></div></button>`).join("")}</div>
      <div class="taglines" style="margin-top:16px">
        ${(c.tools||[]).length ? `<div class="tagline"><span class="lbl">工具</span>${c.tools.map(t => tAttr("c-modeling", t, "工具")).join("")}</div>` : ""}
        <div class="tagline"><span class="lbl">關鍵字</span>${(c.tags||[]).map(tKw).join("")}</div>
      </div>
      ${c.url ? `<a class="srcbtn" href="${esc(c.url)}" target="_blank" rel="noopener">${ico("i-open")}原始出處</a>` : `<p class="legend-note">出處待查證</p>`}
    </div></div>
  <section class="sec"><h3>${ico("i-case")}更多類似</h3><div class="subfeed" id="subMore"></div></section>`;
}
function seedDetail(i){
  const p = A.project_seeds[i];
  return `<div class="closeup"><div class="left" style="background:var(--A-tint);display:grid;place-items:center;min-height:380px"><svg viewBox="0 0 24 24" style="width:140px;height:140px;stroke:var(--A-deep);fill:none;stroke-width:1.2"><use href="#i-seed"/></svg></div>
    <div class="right"><div class="kicker">${badge("seed", true)}</div><h2 style="font-size:28px">${esc(p.title)}</h2>
    <div class="facts"><div class="fact"><div class="ico" style="font:900 15px 'JetBrains Mono'">${p.difficulty}/5</div><small>難度</small><b>${dots(p.difficulty)}</b></div>
    <div class="fact" style="grid-column:span 2"><div class="ico">${ico("w-hybrid")}</div><small>搭配</small><div class="chain">${["A01", ...(p.combine_with||[])].map(id => tAlgo(id)).join("<b>＋</b>")}</div></div></div>
    <p class="oneliner">${esc(p.brief)}</p></div></div>
  <section class="sec"><h3>${ico("i-var")}可以從這些變形出發</h3><div class="subfeed" id="subMore"></div></section>`;
}

/* ================================================================
   6. 啟動

renderChips(); renderFeed();
if(location.hash.length > 1) setTimeout(() => open(decodeURIComponent(location.hash.slice(1))), 100);
