<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字索引｜GH 演算法設計圖鑑</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#1d1d1b; --mute:#6b675f; --line:#e2ddd2;
  --A:#c8553d; --B:#588b3a; --C:#2f7fb5; --D:#8a4fbf; --E:#d49a1f; --F:#2a9d8f;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.6}
a{color:inherit}
header{padding:28px 32px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
header h1{margin:0;font-size:26px;letter-spacing:.04em}
header h1 small{font-weight:400;color:var(--mute);font-size:15px;margin-left:10px}
.stats{display:flex;gap:22px;margin-top:10px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:20px;margin-right:4px}
nav.tabs{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer;
  color:var(--mute);border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:700}
.layout{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 170px)}
aside{padding:20px 20px 60px;border-right:1px solid var(--line);position:sticky;top:0;align-self:start;
  max-height:100vh;overflow:auto;background:var(--paper)}
aside h3{font-size:12px;letter-spacing:.12em;color:var(--mute);margin:18px 0 8px;font-weight:600}
aside input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;
  user-select:none;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.clear{margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
main{padding:22px 28px 80px}
.resultbar{color:var(--mute);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
.card .band{height:78px;position:relative;color:#fff;padding:12px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.card .band svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.card .band .id{position:relative;font-size:28px;font-weight:800;letter-spacing:.02em}
.card .band .fam{position:relative;font-size:12px;opacity:.95}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h4{margin:0;font-size:17px}
.card h4 small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.card p{margin:0;font-size:14px;color:#3c3a35}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tag{font-size:12px;background:#efebe2;border-radius:4px;padding:1px 7px;color:#4a463e}
.tag.cat{background:#1d1d1b;color:#fff}
.tag.logic{background:#fff;border:1px solid var(--line)}
.stars{color:#c98a12;letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars i{color:#d8d2c4;font-style:normal}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case .band{height:8px;padding:0}
.case .who{font-size:12px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:8px;padding:12px 16px}
.item h5{margin:0 0 4px;font-size:15px}
.item .k{font-size:12px;color:var(--mute);margin-right:4px}
.item p{margin:2px 0;font-size:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;z-index:10;overflow:auto;padding:40px 16px}
.modal.on{display:block}
.sheet{max-width:980px;margin:0 auto;background:var(--paper);border-radius:14px;overflow:hidden}
.sheet .hero{padding:26px 30px;color:#fff;position:relative}
.sheet .hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.sheet .hero > *{position:relative}
.sheet .hero h2{margin:0;font-size:28px}
.sheet .hero .sub{opacity:.9}
.sheet .x{position:absolute;right:18px;top:14px;font-size:26px;cursor:pointer;background:none;border:0;color:#fff;z-index:2}
.sheet .content{padding:22px 30px 36px}
.sheet h3{font-size:16px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sheet ol,.sheet ul{margin:0;padding-left:22px}
.sheet table{border-collapse:collapse;width:100%;font-size:14px}
.sheet td,.sheet th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.sheet th{color:var(--mute);font-weight:600;font-size:12px}
.note{background:#fbf3df;border-radius:8px;padding:10px 14px;font-size:14px}
.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.var{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;font-size:14px}
.var b{display:block;margin-bottom:2px}
.var .wc{font-size:12px;color:var(--mute)}
details.case-d{border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px}
details.case-d summary{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.case-d .in{padding:0 14px 12px;font-size:14px}
.empty{color:var(--mute);padding:40px;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
@media (max-width:820px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><a href="index.html"><img src="assets/nycu-logo.png" alt="國立陽明交通大學" width="640" height="143" style="height:26px;width:auto;display:block"></a><h1>GH 演算法設計圖鑑<small>文字索引・六大家族・全部演算法與案例</small></h1><nav style="margin-left:auto;display:flex;gap:14px;font-size:14px;font-weight:700"><a href="index.html">關於</a><a href="atlas.html">圖鑑</a><a href="catalog.html" aria-current="page" style="text-decoration:none">文字索引</a></nav></div>
  <div class="stats" id="stats"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="algos" class="on">演算法總覽</button>
    <button data-tab="cases">應用案例</button>
    <button data-tab="vars">變形食譜</button>
    <button data-tab="seeds">延伸專案種子</button>
  </nav>
</header>
<div class="layout">
  <aside id="filters"></aside>
  <main>
    <div class="resultbar" id="resultbar"></div>
    <div id="view"></div>
  </main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="data.js"></script>
<script>
const D = window.CATALOG;
const FAM_COLOR = {A:"var(--A)",B:"var(--B)",C:"var(--C)",D:"var(--D)",E:"var(--E)",F:"var(--F)"};
const ALG = Object.fromEntries(D.algorithms.map(a => [a.id, a]));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars = n => `<span class="stars" title="${D.difficulty[n]}">${"★".repeat(n)}<i>${"★".repeat(5-n)}</i></span>`;
const famOf = c => (ALG[c.algo] || {}).family || c.algo?.[0] || "";

// 每個家族一種底紋，當卡片背景
function motif(f){
  const s = 'stroke="#fff" fill="none" stroke-width="1.4"';
  switch(f){
    case "A": { let p=""; for(let i=0;i<9;i++){const x=20+i*38;p+=`<path ${s} d="M${x} 90 L${x} 55 M${x} 65 L${x-10} 45 M${x} 65 L${x+10} 45 M${x} 55 L${x} 35"/>`;} return p; }
    case "B": { let p=""; for(let i=0;i<60;i++){const a=i*2.39996,r=3.2*Math.sqrt(i);p+=`<circle cx="${280+r*Math.cos(a)*3}" cy="${40+r*Math.sin(a)*3}" r="2" fill="#fff"/>`;} return p; }
    case "C": { let p=""; for(let k=0;k<7;k++){let d=`M0 ${10+k*12}`;for(let x=0;x<=360;x+=12)d+=` L${x} ${10+k*12+6*Math.sin(x/28+k)}`;p+=`<path ${s} d="${d}"/>`;} return p; }
    case "D": { let p=""; for(let i=0;i<26;i++){const x=(i*53)%340+10,y=(i*37)%70+8,a=0.4+0.05*i;p+=`<path ${s} d="M${x} ${y} l${8*Math.cos(a)} ${8*Math.sin(a)}"/>`;} return p; }
    case "E": { let p=""; const cs=[[40,40,24],[88,30,18],[80,68,14],[130,50,26],[180,28,16],[190,66,20],[235,44,22],[280,30,14],[290,64,18],[335,45,20]]; cs.forEach(c=>p+=`<circle ${s} cx="${c[0]}" cy="${c[1]}" r="${c[2]}"/>`); return p; }
    case "F": { let p=""; for(let i=0;i<10;i++)for(let j=0;j<3;j++){const x=i*36,y=j*36,r=(i*7+j*3)%2;p+=r?`<path ${s} d="M${x} ${y+18} A18 18 0 0 0 ${x+18} ${y} M${x+18} ${y+36} A18 18 0 0 1 ${x+36} ${y+18}"/>`:`<path ${s} d="M${x+18} ${y} A18 18 0 0 0 ${x+36} ${y+18} M${x} ${y+18} A18 18 0 0 1 ${x+18} ${y+36}"/>`;} return p; }
  }
  return "";
}
const motifSvg = f => `<svg viewBox="0 0 360 90" preserveAspectRatio="xMidYMid slice">${motif(f)}</svg>`;

// ---------- state ----------
const state = { tab:"algos", q:"", fam:new Set(), cat:new Set(), logic:new Set(), diff:new Set(), scale:new Set(), tag:new Set(), algo:new Set() };

function uniq(arr){ return [...new Set(arr)].filter(Boolean); }
function topTags(list, n){
  const m={}; list.forEach(t=>m[t]=(m[t]||0)+1);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
}

function chipGroup(title, key, items, labelFn = x=>x, dotFn = null){
  if(!items.length) return "";
  return `<h3>${title}</h3><div class="chips">${items.map(v=>
    `<span class="chip ${state[key].has(String(v))?"on":""}" data-k="${key}" data-v="${esc(v)}">${dotFn?`<span class="dot" style="background:${dotFn(v)}"></span>`:""}${esc(labelFn(v))}</span>`).join("")}</div>`;
}

function renderFilters(){
  const t = state.tab;
  let h = `<input type="search" id="q" placeholder="搜尋名稱、設計師、關鍵字…" value="${esc(state.q)}">`;
  h += chipGroup("家族", "fam", Object.keys(D.families), f=>`${f} ${D.families[f]}`, f=>FAM_COLOR[f]);
  if(t==="cases") h += chipGroup("應用類型", "cat", Object.keys(D.categories), c=>D.categories[c]);
  if(t==="algos") h += chipGroup("演算法邏輯", "logic", D.logics);
  h += chipGroup("難度", "diff", [1,2,3,4,5], n=>`${"★".repeat(n)} ${D.difficulty[n]}`);
  if(t==="cases") h += chipGroup("尺度", "scale", uniq(D.cases.map(c=>c.scale)));
  if(t!=="algos") h += chipGroup("演算法", "algo", D.algorithms.map(a=>a.id), id=>`${id} ${ALG[id].name_zh}`);
  const tagSrc = t==="cases" ? D.cases.flatMap(c=>c.tags||[]) : D.algorithms.flatMap(a=>a.tags||[]);
  if(t==="algos"||t==="cases") h += chipGroup("標籤", "tag", topTags(tagSrc, 36));
  h += `<button class="clear" id="clear">清除所有篩選</button>`;
  h += `<h3>難度說明</h3><div style="font-size:12px;color:var(--mute)">
    ★ 入門：單一迴圈、直接公式<br>★★ 基礎：一個 class 或遞迴<br>★★★ 中階：鄰居搜尋、收斂、調參<br>★★★★ 進階：空間索引、回溯、3D 網格<br>★★★★★ 研究級：需讀論文、數值穩定</div>`;
  const f = document.getElementById("filters");
  f.innerHTML = h;
  const q = f.querySelector("#q");
  q.oninput = e => { state.q = e.target.value; renderView(); };
  f.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const s = state[c.dataset.k], v = c.dataset.v;
    s.has(v) ? s.delete(v) : s.add(v);
    c.classList.toggle("on"); renderView();
  });
  f.querySelector("#clear").onclick = () => { ["fam","cat","logic","diff","scale","tag","algo"].forEach(k=>state[k].clear()); state.q=""; renderFilters(); renderView(); };
}

const hit = (set, vals) => !set.size || [].concat(vals).some(v => set.has(String(v)));
const textHit = obj => !state.q || JSON.stringify(obj).toLowerCase().includes(state.q.toLowerCase());

// ---------- views ----------
function viewAlgos(){
  const list = D.algorithms.filter(a => hit(state.fam,a.family) && hit(state.logic,a.logic||[]) && hit(state.diff,a.difficulty) && hit(state.tag,a.tags||[]) && textHit(a));
  setBar(`${list.length} / ${D.algorithms.length} 個演算法`);
  if(!list.length) return empty();
  return `<div class="grid">${list.map(a=>{
    const n = D.cases.filter(c=>c.algo===a.id).length;
    return `<div class="card" data-algo="${a.id}">
      <div class="band" style="background:${FAM_COLOR[a.family]}">${motifSvg(a.family)}<span class="id">${a.id}</span><span class="fam">${a.family} ${esc(a.family_name)}</span></div>
      <div class="body">
        <div class="row"><h4>${esc(a.name_zh)}<small>${esc(a.name_en)}</small></h4>${stars(a.difficulty)}</div>
        <p>${esc(a.one_liner)}</p>
        <div class="meta">${(a.logic||[]).map(l=>`<span class="tag logic">${esc(l)}</span>`).join("")}${(a.tags||[]).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="row" style="font-size:12px;color:var(--mute)"><span>${a.loc||"?"} 行・${esc((a.data_structure||[]).join("、"))}</span><span>${n} 案例・${(a.variations||[]).length} 變形</span></div>
      </div></div>`;}).join("")}</div>`;
}

function viewCases(){
  const list = D.cases.filter(c => hit(state.fam,famOf(c)) && hit(state.cat,[c.category,...(c.categories_extra||[])]) && hit(state.diff,c.difficulty) && hit(state.scale,c.scale) && hit(state.tag,c.tags||[]) && hit(state.algo,c.algo) && textHit(c));
  setBar(`${list.length} / ${D.cases.length} 個案例`);
  if(!list.length) return empty();
  return `<div class="grid">${list.map(c=>{
    const a = ALG[c.algo]||{}; const f = famOf(c);
    return `<div class="card case" data-algo="${c.algo}" data-case="${esc(c.id)}">
      <div class="band" style="background:${FAM_COLOR[f]}"></div>
      <div class="body">
        <div class="row"><span class="tag cat">${esc(D.categories[c.category])}</span>${stars(c.difficulty)}</div>
        <h4>${esc(c.title)}<small>${esc(c.creator)}${c.year?`・${esc(c.year)}`:""}</small></h4>
        <p>${esc(c.summary)}</p>
        <div class="meta"><span class="tag" style="background:${FAM_COLOR[f]};color:#fff">${esc(c.algo)} ${esc(a.name_zh||"")}</span>${c.scale?`<span class="tag logic">${esc(c.scale)}</span>`:""}${(c.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
        <div class="who">${(c.variations||[]).length} 種變形${c.url?`・<a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">原始出處 ↗</a>`:`・<span title="研究時搜尋額度用完，出處尚未查證">⚠ 出處待查證</span>`}</div>
      </div></div>`;}).join("")}</div>`;
}

function viewVars(){
  const rows = D.algorithms.flatMap(a => (a.variations||[]).map(v => ({...v, a})))
    .filter(r => hit(state.fam,r.a.family) && hit(state.diff,r.level) && hit(state.algo,r.a.id) && textHit({v:r.title,h:r.how,w:r.what_changes,r:r.result,n:r.a.name_zh}));
  setBar(`${rows.length} 條變形食譜：從基礎範例出發，改一個地方就能長出新東西`);
  if(!rows.length) return empty();
  return `<div class="list">${rows.map(r=>`<div class="item" style="border-left-color:${FAM_COLOR[r.a.family]}">
    <div class="row"><h5>${esc(r.title)}　<span style="font-weight:400;color:var(--mute);font-size:13px" data-algo="${r.a.id}" class="link">${r.a.id} ${esc(r.a.name_zh)}</span></h5>${stars(r.level)}</div>
    <p><span class="k">改哪裡</span>${esc(r.what_changes)}</p>
    <p><span class="k">怎麼改</span>${esc(r.how)}</p>
    <p><span class="k">得到</span>${esc(r.result)}</p></div>`).join("")}</div>`;
}

function viewSeeds(){
  const rows = D.algorithms.flatMap(a => (a.project_seeds||[]).map(p => ({...p, a})))
    .filter(r => hit(state.fam,r.a.family) && hit(state.diff,r.difficulty) && hit(state.algo,[r.a.id,...(r.combine_with||[])]) && textHit({t:r.title,b:r.brief,n:r.a.name_zh}));
  setBar(`${rows.length} 個延伸專案種子：挑 1–2 個演算法，深入研究並做出自己的變化`);
  if(!rows.length) return empty();
  return `<div class="grid">${rows.map(r=>`<div class="card" data-algo="${r.a.id}">
    <div class="band" style="background:${FAM_COLOR[r.a.family]};height:46px">${motifSvg(r.a.family)}<span class="fam">${r.a.id} ${esc(r.a.name_zh)}</span></div>
    <div class="body"><div class="row"><h4>${esc(r.title)}</h4>${stars(r.difficulty)}</div><p>${esc(r.brief)}</p>
    ${(r.combine_with||[]).length?`<div class="meta">${r.combine_with.map(id=>`<span class="tag">＋ ${esc(id)} ${esc((ALG[id]||{}).name_zh||"")}</span>`).join("")}</div>`:""}</div></div>`).join("")}</div>`;
}

function setBar(t){ document.getElementById("resultbar").textContent = t; }
function empty(){ return `<div class="empty">沒有符合條件的項目，試著減少篩選條件。</div>`; }

function renderView(){
  const v = document.getElementById("view");
  v.innerHTML = {algos:viewAlgos, cases:viewCases, vars:viewVars, seeds:viewSeeds}[state.tab]();
  v.querySelectorAll("[data-algo]").forEach(el => el.onclick = e => { e.stopPropagation(); openAlgo(el.dataset.algo, el.dataset.case); });
}

// ---------- detail ----------
function openAlgo(id, caseId){
  const a = ALG[id]; if(!a) return;
  const cases = D.cases.filter(c=>c.algo===id);
  const s = document.getElementById("sheet");
  s.innerHTML = `
  <div class="hero" style="background:${FAM_COLOR[a.family]}">${motifSvg(a.family)}
    <button class="x" id="close">×</button>
    <div class="sub">${a.family} ${esc(a.family_name)}・${esc(a.file||"")}・${a.loc||"?"} 行</div>
    <h2>${a.id}　${esc(a.name_zh)} <span style="font-weight:400;font-size:18px">${esc(a.name_en)}</span></h2>
    <div style="margin-top:6px">${stars(a.difficulty).replace('class="stars"','class="stars" style="color:#fff"')} ${esc(D.difficulty[a.difficulty])}｜${esc(a.difficulty_reason)}</div>
  </div>
  <div class="content">
    <p style="font-size:17px">${esc(a.one_liner)}</p>
    <div class="meta">${(a.logic||[]).map(l=>`<span class="tag logic">邏輯：${esc(l)}</span>`).join("")}${(a.data_structure||[]).map(l=>`<span class="tag logic">資料：${esc(l)}</span>`).join("")}${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>

    <h3>怎麼運作</h3><ol>${(a.how_it_works||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>

    ${(a.key_params||[]).length?`<h3>關鍵參數</h3><table><tr><th>參數</th><th>影響</th></tr>${a.key_params.map(p=>`<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.effect)}</td></tr>`).join("")}</table>`:""}

    <h3>C# 觀念與先備</h3>
    <div class="meta">${(a.csharp_concepts||[]).map(x=>`<span class="tag"><code>${esc(x)}</code></span>`).join("")}</div>
    <p style="font-size:14px;color:var(--mute)">先備：${esc((a.prerequisites||[]).join("、"))}</p>
    ${a.teaching_note?`<div class="note"><b>學習建議</b>　${esc(a.teaching_note)}</div>`:""}

    <h3>變形食譜（${(a.variations||[]).length}）</h3>
    <div class="var-grid">${(a.variations||[]).map(v=>`<div class="var"><div class="row"><b>${esc(v.title)}</b>${stars(v.level)}</div>
      <div class="wc">改：${esc(v.what_changes)}</div><div>${esc(v.how)}</div><div class="wc">→ ${esc(v.result)}</div></div>`).join("")}</div>

    <h3>應用案例（${cases.length}）</h3>
    ${cases.map(c=>`<details class="case-d" id="case-${esc(c.id)}" ${c.id===caseId?"open":""}><summary>
      <span class="tag cat">${esc(D.categories[c.category])}</span><b>${esc(c.title)}</b>
      <span style="color:var(--mute);font-size:13px">${esc(c.creator)}${c.year?`・${esc(c.year)}`:""}</span>${stars(c.difficulty)}</summary>
      <div class="in"><p>${esc(c.summary)}</p>
      <table><tr><th style="width:26%">變形</th><th>怎麼改</th><th style="width:28%">效果</th></tr>
      ${(c.variations||[]).map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.how)}</td><td>${esc(v.effect)}</td></tr>`).join("")}</table>
      <div class="meta" style="margin-top:8px">${c.scale?`<span class="tag logic">${esc(c.scale)}</span>`:""}${(c.tools||[]).map(t=>`<span class="tag logic">${esc(t)}</span>`).join("")}${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${c.url?`<p><a href="${esc(c.url)}" target="_blank" rel="noopener">原始出處 ↗</a></p>`:`<p style="color:var(--mute);font-size:13px">⚠ 出處待查證（可用作者＋作品名自行搜尋）</p>`}</div></details>`).join("")}

    <h3>延伸專案種子</h3>
    <div class="var-grid">${(a.project_seeds||[]).map(p=>`<div class="var"><div class="row"><b>${esc(p.title)}</b>${stars(p.difficulty)}</div><div>${esc(p.brief)}</div>
      ${(p.combine_with||[]).length?`<div class="wc">搭配：${p.combine_with.map(x=>esc(x+" "+((ALG[x]||{}).name_zh||""))).join("、")}</div>`:""}</div>`).join("")}</div>

    ${(a.references||[]).length?`<h3>延伸閱讀</h3><ul>${a.references.map(r=>`<li>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}${r.author?`｜${esc(r.author)}`:""}${r.year?` (${esc(r.year)})`:""}</li>`).join("")}</ul>`:""}
  </div>`;
  document.getElementById("modal").classList.add("on");
  document.getElementById("close").onclick = closeModal;
  history.replaceState(null,"",`#${id}`);
  if(caseId){ const el = document.getElementById("case-"+caseId); el && setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),50); }
  else document.getElementById("modal").scrollTop = 0;
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); history.replaceState(null,"",location.pathname); }
document.getElementById("modal").onclick = e => { if(e.target.id==="modal") closeModal(); };
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

// ---------- init ----------
document.getElementById("stats").innerHTML =
  `<span><b>${D.algorithms.length}</b>演算法</span><span><b>${D.cases.length}</b>應用案例</span>` +
  `<span><b>${D.algorithms.reduce((s,a)=>s+(a.variations||[]).length,0)}</b>變形食譜</span>` +
  `<span><b>${D.algorithms.reduce((s,a)=>s+(a.project_seeds||[]).length,0)}</b>專案種子</span>` +
  `<span class="legend">${Object.entries(D.families).map(([k,v])=>`<span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${FAM_COLOR[k]}"></span> ${k} ${v}</span>`).join("")}</span>`;
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  state.tab = b.dataset.tab; renderFilters(); renderView();
});
renderFilters(); renderView();
if(location.hash && ALG[location.hash.slice(1)]) openAlgo(location.hash.slice(1));
</script>
</body>
</html>
